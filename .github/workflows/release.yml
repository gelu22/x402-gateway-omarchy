name: Release

# Release workflow for the PUBLIC plugin repo. It lives in the private monorepo
# as deploy/release-public.yml (NOT under .github/workflows/, so a monorepo tag
# never triggers it) and scripts/publish-public.sh copies it into the public
# snapshot as .github/workflows/release.yml.
#
# The daemon source ships in this repository, so the build and the sigstore
# attestation both happen here: a reviewer can read the exact code that produced
# the shipped binary, and end users can verify it with:
#   gh attestation verify <file> --repo <this-repo>
#
# Actions are pinned by commit SHA (a moved tag here would let a compromised
# action mint attestations and publish assets in the trusted repo). No secrets
# are required — the default GITHUB_TOKEN is enough.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.13"

      - name: Build daemon + bundle + version stamp
        run: |
          # Stamp the release tag into the binary (strip leading "v"; a bare
          # "v" tag falls back to dev rather than an empty version).
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-dev}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "dist/gateway-linux-$arch" ./cmd/gateway
          done
          # The public repo flattens the plugin to the root (marketplace layout);
          # the release bundle uses the layout install.sh expects: plugin/omarchy/…
          rm -rf bundle
          mkdir -p bundle/plugin/omarchy bundle/scripts bundle/config
          cp ./*.qml ./*.js manifest.json bundle/plugin/omarchy/
          printf '{\n  "version": "%s",\n  "git_sha": "%s"\n}\n' \
            "$VERSION" "$GITHUB_SHA" > bundle/plugin/omarchy/build-info.json
          cp scripts/setup-agents.sh bundle/scripts/
          cp config/gateway-config.json bundle/config/
          tar -czf dist/plugin-bundle.tar.gz -C bundle .
          tar -tzf dist/plugin-bundle.tar.gz
          # Ship the installer/deinstaller as attested release assets too, so
          # users fetch a pinned, signed artifact instead of a mutable branch.
          cp scripts/install.sh scripts/uninstall.sh dist/
          (cd dist && sha256sum gateway-linux-* plugin-bundle.tar.gz install.sh uninstall.sh > sha256sums.txt)

      - name: Attest build provenance (sigstore keyless, GitHub OIDC)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/gateway-linux-amd64
            dist/gateway-linux-arm64
            dist/plugin-bundle.tar.gz
            dist/install.sh
            dist/uninstall.sh
            dist/sha256sums.txt

      - name: Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/gateway-linux-amd64
            dist/gateway-linux-arm64
            dist/plugin-bundle.tar.gz
            dist/install.sh
            dist/uninstall.sh
            dist/sha256sums.txt
          generate_release_notes: true
